function route() {
  const h = location.hash.replace(/^#\/?/, "");
  const [page, param] = h.split("/");
  const known = NAV.flatMap(g => g.items).some(i => i.route === page);
  state.page = known ? page : "overview";
  state.tenantId = page === "tenants" && param ? param : null;
  render();
}
function go(route) { location.hash = "#/" + route; }

function render() {
  // nav
  const activeItem = state.tenantId ? "tenants" : state.page;
  $("#nav").innerHTML = NAV.map(g => `
    <div class="mb-5"><div class="eyebrow px-2 pb-1.5">${g.group}</div>
    <div class="space-y-0.5">${g.items.map(it => `
      <a class="nav-item ${it.route === activeItem ? "active" : ""}" onclick="go('${it.route}')">
        <i class="ph ph-${it.icon} text-base"></i><span class="nav-label">${it.label}</span>
      </a>`).join("")}</div></div>`).join("");
  $("#mobile-nav").innerHTML = NAV.flatMap(g => g.items).map(it => `
    <a onclick="go('${it.route}')" class="whitespace-nowrap rounded-full px-3 py-1 text-[12.5px] ${it.route === activeItem ? "bg-foreground font-medium text-background" : "bg-card text-mutedfg ring-1 ring-border"}">${it.label}</a>`).join("");
  const g = NAV.find(gr => gr.items.some(i => i.route === activeItem));
  $("#crumb-group").textContent = g ? g.group : "Platform";
  $("#crumb-page").textContent = state.tenantId ? "Tenant detail" : (g && g.items.find(i => i.route === state.page) || {}).label || "Overview";

  const views = { overview: viewOverview, tenants: viewTenants, "tenant-detail": viewTenantDetail, channels: viewChannels,
    operations: viewOperations, guardrails: viewGuardrails, audit: viewAudit, "api-keys": viewApiKeys,
    plans: viewPlans, billing: viewBilling, email: viewEmail, admins: viewAdmins };
  const v = views[state.tenantId ? "tenant-detail" : state.page] || viewOverview;
  const pg = $("#page");
  pg.classList.remove("rise"); void pg.offsetWidth; pg.classList.add("rise");
  pg.innerHTML = v();
}

function createTenant(f) {
  const name = f["t-name"].value;
  const slug = "csq" + Math.random().toString(36).slice(2, 10);
  TENANTS.unshift({ id: "n" + Date.now(), name, slug, status: "ACTIVE", createdAt: new Date().toISOString().slice(0, 10),
    users: 1, channels: 0, conversations: 0, msgs30d: 0, plan: null,
    detail: { users: [{ id: "nu", name: f["t-oname"].value, email: f["t-email"].value, role: "OWNER" }], agents: [], channels: [], campaigns: [], sources: [] } });
  closeModal();
  state.tenantNotice = `Tenant created. Tenant ID: ${slug}. The welcome email was NOT sent (platform SMTP not configured or failed) - hand over the email and password manually.`;
  go("tenants"); render();
}

function channelAct(id, act) {
  const c = CHANNELS.find(x => x.id === id);

  c.held = false;
  state.channelMsg = `${act} command sent. The worker picks it up within 2 seconds.`;
  toast(`${act} command queued for ${c.label}`);
  render();
  setTimeout(() => { if (act === "reconnect") { c.status = "CONNECTED"; c.held = true; c.until = new Date(Date.now() + 30 * 60000).toTimeString().slice(0, 5); } render(); }, 3000);
}

  return pageHead("Configuration", "Billing", "Invoices, plan requests, and payment settings",
      `<button class="btn btn-line" onclick="go('plans')">Manage plans</button>
       <button class="btn btn-ink" onclick="modalInvoice()"><i class="ph ph-plus text-sm font-bold"></i>New invoice</button>`)
    + `<div class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
      ${statCard("", "Outstanding", idr(outstanding), INVOICES.filter(i => i.status === "ISSUED").length + " invoices")}
      ${statCard("", "Overdue", overdue, "Needs follow-up")}
      ${statCard("", "Paid this month", idr(698000), "Total paid invoices")}
    </div>
    <div class="mb-5 flex gap-5 border-b border-border">
      ${[["invoices", "Invoices"], ["requests", "Plan requests"], ["settings", "Settings"]].map(([k, l]) =>
        `<button onclick="state.billingTab='${k}'; render()" class="-mb-px border-b-2 pb-2 text-[13px] transition-colors ${tab === k ? "border-ok font-medium text-foreground" : "border-transparent text-mutedfg hover:text-foreground"}">${l}</button>`).join("")}
    </div>
    ${tab === "invoices" ? viewInvoices() : tab === "requests" ? viewRequests() : viewBillingSettings()}`;
}
function viewInvoices() {
  return (NEEDS.length ? `<div class="mb-5 rounded-xl border border-border bg-card">
      <div class="flex items-center justify-between border-b border-border px-5 py-3"><span class="eyebrow text-foreground">Needs invoicing</span><span class="text-[11px] text-mutedfg">No invoice for this month yet</span></div>
      ${NEEDS.map(n => `<div class="flex items-center gap-4 px-5 py-2.5">
        <div class="min-w-0 flex-1"><p class="text-[13px] font-medium">${n.tenant}</p><p class="text-[11.5px] text-mutedfg">${n.plan}, ${idr(n.price)}</p></div>
        <button class="btn btn-line" onclick="modalInvoice('${esc(n.tenant)}')">Create</button></div>`).join("")}
    </div>` : "")
    + `<div class="ledger-wrap"><table class="ledger">
      <thead><tr><th>Number</th><th>Tenant</th><th>Period</th><th class="tr">Amount</th><th>Status</th><th>Due</th><th></th></tr></thead>
      <tbody>${INVOICES.map(i => {
        const overdue = i.status === "ISSUED" && i.due < "28 Nov 2026";
        return `<tr><td class="font-mono text-[12px]">${i.number}</td>
        <td><div class="font-medium">${i.tenant}</div><div class="text-[12px] text-mutedfg">${i.plan}</div></td>
        <td class="whitespace-nowrap text-[12.5px] text-mutedfg">${i.period}</td>
        <td class="tr font-mono tabular-nums">${idr(i.amount)}</td>
        <td>${statusPill(i.status === "PAID" ? "ok" : i.status === "VOID" ? "off" : overdue ? "bad" : "warn", i.status === "PAID" ? "Paid" : i.status === "VOID" ? "Void" : overdue ? "Overdue" : "Unpaid")}</td>
        <td class="whitespace-nowrap font-mono text-[12px] text-mutedfg">${i.paid || i.due}</td>
        <td class="tr">${i.status === "ISSUED" ? `<button class="btn btn-ghost go" onclick="modalPay('${i.id}')">Mark paid</button>
          <button class="btn btn-ghost danger" onclick="voidInvoice('${i.id}')">Void</button>` : ""}</td></tr>`; }).join("")}
      </tbody></table></div>`;
}
function modalPay(id) {
  const i = INVOICES.find(x => x.id === id);
  openModal(modalHead(i.number, "Mark as paid", `${i.tenant}, ${idr(i.amount)}`) + `
    <form class="space-y-4 p-5" onsubmit="event.preventDefault(); i2 = INVOICES.find(x => x.id === '${id}'); i2.status = 'PAID'; i2.paid = '22 Nov 2026'; closeModal(); toast('Invoice ${i.number} marked as paid'); render()">
      <div class="space-y-1.5"><label class="lbl" for="pay-method">Method</label>
        <select id="pay-method" class="inp"><option>Transfer</option><option>Cash</option><option>Other</option></select></div>
      <div class="space-y-1.5"><label class="lbl" for="pay-ref">Reference (optional)</label><input id="pay-ref" class="inp" placeholder="Transaction reference"></div>
      <div class="flex justify-end gap-2 pt-1"><button type="button" class="btn btn-line" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-ink">Mark as paid</button></div>
    </form>`);
}
function voidInvoice(id) {
  const i = INVOICES.find(x => x.id === id);
  if (!confirm(`Void invoice ${i.number}?`)) return;
  i.status = "VOID";
  toast(`Invoice ${i.number} voided`);
  render();
}
function viewRequests() {
  return `<div class="ledger-wrap"><table class="ledger">
    <thead><tr><th>Tenant</th><th>Requested plan</th><th>Note</th><th>Status</th><th>Created</th><th></th></tr></thead>
    <tbody>${REQUESTS.map(r => `<tr>
      <td><div class="font-medium">${r.tenant}</div><div class="text-[12px] text-mutedfg">${r.slug}</div></td>
      <td><div>${r.plan}</div><div class="font-mono text-[12px] text-mutedfg">${idr(r.price)}</div></td>
      <td class="max-w-xs truncate text-[12.5px] text-mutedfg">${r.note || "-"}</td>
      <td>${statusPill(r.status === "DONE" ? "ok" : r.status === "REJECTED" ? "off" : "warn", r.status[0] + r.status.slice(1).toLowerCase())}</td>
      <td class="whitespace-nowrap font-mono text-[12px] text-mutedfg">${r.created}</td>
      <td class="tr">${r.status === "NEW" ? `<button class="btn btn-ghost" onclick="reqStatus('${r.id}', 'Contacted')">Contact</button>` : ""}
        ${(r.status === "NEW" || r.status === "CONTACTED") ? `<button class="btn btn-ghost go" onclick="reqStatus('${r.id}', 'Done')">Done</button>
        <button class="btn btn-ghost danger" onclick="reqStatus('${r.id}', 'Rejected')">Reject</button>` : ""}</td></tr>`).join("")}
    </tbody></table></div>`;
}
function reqStatus(id, s) {
  REQUESTS.find(r => r.id === id).status = s.toUpperCase();
  toast("Request marked " + s.toLowerCase());
  render();
}
function viewBillingSettings() {
  return `<form class="rounded-xl border border-border bg-card p-5" onsubmit="event.preventDefault(); toast('Billing settings saved')">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div class="space-y-1.5"><label class="lbl" for="bank-name">Bank</label><input id="bank-name" class="inp" value="BCA"></div>
      <div class="space-y-1.5"><label class="lbl" for="bank-number">Account number</label><input id="bank-number" class="inp font-mono" value="1234567890"></div>
      <div class="space-y-1.5"><label class="lbl" for="bank-holder">Account holder</label><input id="bank-holder" class="inp" value="PT CSQ Indonesia"></div>
      <div class="space-y-1.5"><label class="lbl" for="due-days">Due days</label><input id="due-days" type="number" min="1" max="90" class="inp" value="7"></div>
      <div class="space-y-1.5"><label class="lbl" for="grace-days">Grace days</label><input id="grace-days" type="number" min="0" max="90" class="inp" value="7"></div>
    </div>
    <div class="mt-4 flex items-center justify-between">
      <p class="text-[11.5px] text-mutedfg">Leave the bank blank to show "Contact admin" in the tenant app.</p>
      <button type="submit" class="btn btn-ink">Save</button>
    </div></form>`;
}
function modalInvoice(prefTenant) {
  openModal(modalHead("Billing", "New invoice") + `
    <form class="space-y-4 p-5" onsubmit="event.preventDefault(); this.reportValidity() && (INVOICES.push({ id: 'i' + Date.now(), number: 'INV-202611-000' + (INVOICES.length + 1), tenant: this.tenant.value, plan: 'Manual', period: '1 Nov - 30 Nov 2026', amount: parseInt(this.amount.value) || 0, status: 'ISSUED', due: '29 Nov 2026', paid: null }), closeModal(), toast('Invoice created'), render())">
      <div class="space-y-1.5"><label class="lbl" for="inv-tenant">Tenant</label>
        <select id="inv-tenant" class="inp" required><option value="">- select a tenant -</option>
        ${TENANTS.map(t => `<option ${prefTenant === t.name ? "selected" : ""}>${t.name}</option>`).join("")}</select></div>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div class="space-y-1.5"><label class="lbl" for="inv-plan">Plan</label><select id="inv-plan" class="inp"><option>Manual</option>${PLANS.map(p => `<option>${p.name}</option>`).join("")}</select></div>
        <div class="space-y-1.5"><label class="lbl" for="inv-period">Period</label><input id="inv-period" type="month" class="inp" required value="2026-11"></div>
      </div>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <div class="space-y-1.5"><label class="lbl" for="inv-amount">Amount (IDR)</label><input id="inv-amount" type="number" class="inp" required value="199000"></div>
        <div class="space-y-1.5"><label class="lbl" for="inv-due">Due date</label><input id="inv-due" type="date" class="inp" value="2026-11-29"></div>
      </div>
      <div class="flex justify-end gap-2 pt-1"><button type="button" class="btn btn-line" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-ink">Create invoice</button></div>
    </form>`);
}

function viewEmail() {
  const configured = state.emailConfigured !== false;
  return pageHead("Configuration", "Platform Email", "The default SMTP for all tenants. A tenant's own SMTP still takes precedence when configured.")
    + (state.emailSaved ? `<div class="mb-4 rounded-xl border border-border border-l-2 border-l-ok bg-card px-5 py-3 text-[13px] text-ok">Platform SMTP saved. Tenants without their own SMTP now send through it.</div>` : "")
    + `<div class="rounded-xl border border-border bg-card p-6">
      <div class="mb-6 flex items-center gap-3">
        <span class="flex h-10 w-10 items-center justify-center rounded-full bg-oksoft text-ok"><i class="ph-fill ph-envelope-simple text-xl"></i></span>
        <div><p class="text-sm font-medium">${configured ? "Connected - SMTP (smtp.csq.id:587)" : "Not configured"}</p>
        <p class="text-[13px] text-mutedfg">${configured ? "Sender: no-reply@csq.id" : "Staff invites and scenario Email modules do not send until this is configured (or the tenant sets its own SMTP)."}</p></div>
        ${configured ? `<button class="btn btn-ghost danger ml-auto" onclick="state.emailConfigured = false; state.emailSaved = false; toast('Platform SMTP disconnected'); render()">Disconnect</button>` : ""}
      </div>
      <form class="max-w-xl space-y-4" onsubmit="event.preventDefault(); this.reportValidity() && (state.emailConfigured = true, state.emailSaved = true, toast('Platform SMTP saved'), render())">
        <div><label class="lbl" for="smtp-host">SMTP host</label><input id="smtp-host" class="inp" required value="smtp.csq.id" placeholder="smtp.gmail.com"></div>
        <div class="grid grid-cols-2 gap-4">
          <div><label class="lbl" for="smtp-port">Port</label><input id="smtp-port" type="number" class="inp" required value="587" placeholder="587"></div>
          <div><label class="lbl" for="smtp-secure">Security</label><select id="smtp-secure" class="inp"><option value="starttls">STARTTLS (587)</option><option value="ssl">SSL/TLS (465)</option></select></div>
        </div>
        <div><label class="lbl" for="smtp-username">Username</label><input id="smtp-username" class="inp" required value="no-reply@csq.id" placeholder="user@domain.com"></div>
        <div><label class="lbl" for="smtp-password">Password ${configured ? '<span class="text-mutedfg">(leave blank to keep)</span>' : ""}</label>
          <input id="smtp-password" type="password" class="inp" ${configured ? "" : "required"} placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"></div>
        <div><label class="lbl" for="smtp-from">From address</label><input id="smtp-from" type="email" class="inp" required value="no-reply@csq.id" placeholder="no-reply@csq.id"></div>
        <div class="pt-2"><button type="submit" class="btn btn-ink">Save platform SMTP</button></div>
      </form>
    </div>
    <div class="mt-6 rounded-xl border border-border bg-card p-6">
      <p class="mb-1 text-sm font-medium">Send a test email</p>
      <p class="mb-4 text-[13px] text-mutedfg">Sends one test message through the saved platform SMTP, to any address.</p>
      <form class="flex max-w-xl items-end gap-3" onsubmit="event.preventDefault(); this.reportValidity() && (toast('Test email sent to ' + this.to.value + ' (ID: 3f2a1b0c)'), this.reset())">
        <div class="flex-1"><label class="lbl" for="test-to">Recipient</label><input id="test-to" type="email" class="inp" required placeholder="name@example.com"></div>
        <button type="submit" class="btn btn-line" ${configured ? "" : "disabled"}>Send test email</button>
      </form>
    </div>`;
}

function viewAdmins() {
  return pageHead("Configuration", "Admins", `${ADMINS.length} platform operators`,
      `<button class="btn btn-ink" onclick="modalAdmin()"><i class="ph ph-plus text-sm font-bold"></i>New admin</button>`)
    + `<div class="ledger-wrap"><table class="ledger">
      <thead><tr><th>Operator</th><th>Email</th><th>Since</th><th></th></tr></thead>
      <tbody>${ADMINS.map(a => `<tr>
        <td class="font-medium">${a.name}${a.id === "me" ? '<span class="ml-2 rounded-full bg-oksoft px-2 py-0.5 text-[11px] font-semibold text-ok">You</span>' : ""}</td>
        <td class="text-[13px]">${a.email}</td>
        <td class="font-mono text-[12.5px] text-mutedfg">${a.since}</td>
        <td class="tr">${a.id !== "me" ? `<button class="btn btn-ghost danger" onclick="removeAdmin('${a.id}')">Remove</button>` : ""}</td></tr>`).join("")}
      </tbody></table></div>`;
}
function modalAdmin() {
  openModal(modalHead("Configuration", "New admin") + `
    <form class="space-y-4 p-5" onsubmit="event.preventDefault(); this.reportValidity() && (ADMINS.push({ id: 'a' + Date.now(), name: this['a-name'].value, email: this['a-email'].value, since: '22 Nov 2026' }), closeModal(), toast('Admin added'), render())">
      <div class="space-y-1.5"><label class="lbl" for="a-email">Email</label><input id="a-email" type="email" class="inp" required placeholder="operator@csq.id"></div>
      <div class="space-y-1.5"><label class="lbl" for="a-name">Name</label><input id="a-name" class="inp" required placeholder="Operator name"></div>
      <div class="space-y-1.5"><label class="lbl" for="a-pass">Password</label><input id="a-pass" type="password" class="inp" required minlength="8" placeholder="Minimum 8 characters"></div>
      <div class="flex justify-end gap-2 pt-1"><button type="button" class="btn btn-line" onclick="closeModal()">Cancel</button>
      <button type="submit" class="btn btn-ink">Add admin</button></div>
    </form>`);
}
function removeAdmin(id) {
  const a = ADMINS.find(x => x.id === id);
  if (!confirm(`Remove admin ${a.name}?`)) return;
  ADMINS.splice(ADMINS.indexOf(a), 1);
  toast("Admin removed");
  render();
}

/* ══════════ Boot ══════════ */
let collapsed = false;
function toggleSidebar() {
  collapsed = !collapsed;
  const sb = $("#sidebar");
  sb.classList.toggle("w-14", collapsed); sb.classList.toggle("w-60", !collapsed);
  document.querySelectorAll(".nav-label").forEach(el => el.classList.toggle("hidden", collapsed));
  $("#sidebar-brand").classList.toggle("hidden", collapsed);
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
