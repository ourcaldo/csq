  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }

  .nav-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.65rem;
    padding: 0.45rem 0.75rem;
    border-radius: 0.5rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: rgb(71 85 105);
    transition: background-color 0.12s ease, color 0.12s ease;
    cursor: pointer;
  }
  .nav-link:hover {
    background-color: rgb(248 250 252);
    color: rgb(15 23 42);
  }
  .nav-link.active {
    background-color: rgb(240 253 244);
    color: rgb(21 128 61);
    font-weight: 600;
  }

  .tab-btn {
    position: relative;
    padding: 0.65rem 0.25rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: rgb(100 116 139);
    transition: color 0.15s ease;
    cursor: pointer;
  }
  .tab-btn:hover { color: rgb(15 23 42); }
  .tab-btn.active {
    color: rgb(15 23 42);
    font-weight: 600;
  }
  .tab-btn.active::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 2px;
    background-color: rgb(22 163 74);
  }

  .modal-backdrop { background: rgba(15, 23, 42, 0.45); backdrop-filter: blur(2px); }
  @keyframes pulse-dot { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .live-dot { animation: pulse-dot 1.8s ease-in-out infinite; }

// ══════════ Formatting & UI Helpers ══════════
function esc(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function pad(n) {
  return String(n).padStart(2, "0");
}

function idr(n) {
  return "Rp " + Number(n || 0).toLocaleString("id-ID");
}

function bytes(b) {
  if (!b) return "0 B";
  const units = ["B", "KB", "MB", "GB"];
  let i = 0;
  let val = Number(b);
  while (val >= 1024 && i < units.length - 1) {
    val /= 1024;
    i++;
  }
  return `${val.toFixed(i === 0 ? 0 : 1)} ${units[i]}`;
}

function limitLabel(v) {
  return v === null || v === undefined ? "∞" : Number(v).toLocaleString("en-GB");
}

function statusDot(tone, label) {
  const map = {
    ok: ["bg-emerald-500", "text-emerald-700"],
    warn: ["bg-amber-500", "text-amber-700"],
    bad: ["bg-red-500", "text-red-700"],
    off: ["bg-slate-300", "text-slate-500"]
  };
  const [dot, text] = map[tone] || map.off;
  return `<span class="inline-flex items-center gap-1.5 font-mono text-[11px] font-medium ${text}"><span class="h-1.5 w-1.5 rounded-full ${dot}"></span>${esc(label)}</span>`;
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  document.getElementById("toast-msg").textContent = msg;
  el.classList.remove("opacity-0", "translate-y-4");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.add("opacity-0", "translate-y-4"), 2500);
}

function toggleSidebar(open) {
  document.getElementById("app-sidebar").classList.toggle("-translate-x-full", !open);
  document.getElementById("mobile-overlay").classList.toggle("hidden", !open);
}

function handleQuickJump(val) {
  const q = val.trim().toLowerCase();
  if (!q) return;
  const routeMatch = [...MAIN_NAV, ...SETTINGS_NAV]
    .flatMap((g) => g.items)
    .find((item) => item.label.toLowerCase().includes(q) || item.route.includes(q));
  if (routeMatch) {
    go(routeMatch.route);
    return;
  }
  const tenantMatch = TENANTS.find((t) => t.name.toLowerCase().includes(q) || t.slug.toLowerCase().includes(q));
  if (tenantMatch) {
    go(`tenants/${tenantMatch.id}`);
  }
}

document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("global-search").focus();
  }
});

// ══════════ Client Router ══════════
function go(path) {
  location.hash = "#/" + path.replace(/^\/+/, "");
  toggleSidebar(false);
}

function parseRoute() {
  const raw = location.hash.replace(/^#\/?/, "");
  const [seg1, seg2, seg3] = raw.split("/");
  const allMainRoutes = MAIN_NAV.flatMap((g) => g.items.map((i) => i.route));
  const knownPages = [...allMainRoutes, ...SETTINGS_ROUTES];
  state.page = knownPages.includes(seg1) ? seg1 : "overview";
  state.subView = null;
  state.paramId = null;

  if (seg1 === "tenants" && seg2 === "new") {
    state.subView = "tenant-new";
  } else if (seg1 === "tenants" && seg2) {
    state.subView = "tenant-detail";
    state.paramId = seg2;
  } else if (seg1 === "plans" && seg2 === "new") {
    state.subView = "plan-editor";
  } else if (seg1 === "plans" && seg2 === "edit" && seg3) {
    state.subView = "plan-editor";
    state.paramId = seg3;
  } else if (seg1 === "billing" && seg2 === "new-invoice") {
    state.subView = "invoice-new";
  }

  render();
}

function triggerChannelCommand(id, action) {
  const c = CHANNELS.find((x) => x.id === id);
  if (!c) return;
  c.status = action === "reconnect" ? "CONNECTING" : "DISCONNECTED";
  c.held = false;
  state.channelMsg = `Dispatched "${action}" command for ${c.label}. Worker polls command queue within 2 seconds.`;
  showToast(`Command "${action}" queued`);
  render();
  if (action === "reconnect") {
    setTimeout(() => {
      c.status = "CONNECTED";
      c.held = true;
      c.until = "14:55";
      c.upd = "2026-11-22 14:26";
      render();
    }, 2400);
  }
}

              </tr>
            `).join("")}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function retrySingleMessage(id) {
  const idx = FAILED_MSGS.findIndex((m) => m.id === id);
  if (idx > -1) FAILED_MSGS.splice(idx, 1);
  showToast("Message requeued to worker outbox");
  render();
}

function retryAllMessages() {
  FAILED_MSGS.splice(0, FAILED_MSGS.length);
  showToast("All failed messages requeued");
  render();
}

function assignTenantPlan(tenantName, planId) {
  const row = USAGE.find((u) => u.tenant === tenantName);
  const plan = PLANS.find((p) => p.id === planId);
  if (row) {
    row.planId = planId || null;
    row.mauLimit = plan ? plan.mau : null;
    row.creditsLimit = plan ? plan.credits : null;
    row.staffLimit = plan ? plan.staff : null;
    row.channelLimit = plan ? plan.channels : null;
  }
  showToast(plan ? `Assigned ${plan.name} to ${tenantName}` : `Cleared plan for ${tenantName}`);
  render();
}

function savePlanEditor(e) {
  e.preventDefault();
  const parseCap = (id) => {
    const raw = document.getElementById(id).value.trim();
    return raw === "" ? null : Number(raw);
  };
  const payload = {
    name: document.getElementById("pe-name").value.trim(),
    price: Number(document.getElementById("pe-price").value || 0),
    credits: parseCap("pe-credits"),
    mau: parseCap("pe-mau"),
    staff: parseCap("pe-staff"),
    channels: parseCap("pe-channels"),
    features: Array.from(document.querySelectorAll('input[name="pe-feat"]:checked')).map((el) => el.value)
  };

  if (state.paramId) {
    const existing = PLANS.find((p) => p.id === state.paramId);
    if (existing) Object.assign(existing, payload);
    showToast(`Plan "${payload.name}" updated`);
  } else {
    PLANS.push({ id: "p_" + Date.now(), ...payload });
    showToast(`Plan "${payload.name}" created`);
  }
  go("plans");
}

          <div>
            <label for="ni-period" class="block text-xs font-medium text-slate-700">Period Label</label>

          <div>
            <label for="ni-amount" class="block text-xs font-medium text-slate-700">Amount (IDR) <span class="text-red-500">*</span></label>
            <input id="ni-amount" type="number" min="0" step="1000" required value="199000" class="mt-1.5 h-9 w-full rounded-md border border-slate-300 bg-white px-3 font-mono text-xs" />

          <div>
            <label for="ni-due" class="block text-xs font-medium text-slate-700">Due Date</label>

      <div class="flex items-center justify-end gap-2.5 pt-5">

}

function submitNewInvoice(e) {
  e.preventDefault();
  const num = "INV-202611-" + String(INVOICES.length + 1).padStart(4, "0");
  INVOICES.unshift({
    id: "i_" + Date.now(),
    number: num,
    tenant: document.getElementById("ni-tenant").value,
    plan: document.getElementById("ni-plan").value,
    period: document.getElementById("ni-period").value.trim(),
    amount: Number(document.getElementById("ni-amount").value || 0),
    status: "ISSUED",
    due: document.getElementById("ni-due").value.trim(),
    paid: null
  });
  showToast(`Invoice ${num} issued`);
  go("billing");
}

  showToast("Platform operator added");

}

// ══════════ Destructive Confirm Modal (Zero native confirm/alert) ══════════
let confirmCtx = null;

function openConfirmModal({ title, desc, requireText, btnLabel, onConfirm }) {
  confirmCtx = { requireText: requireText || null, onConfirm };
  document.getElementById("confirm-title").textContent = title;
  document.getElementById("confirm-desc").innerHTML = desc;
  document.getElementById("confirm-action-btn").textContent = btnLabel || "Confirm";

  const typeWrap = document.getElementById("confirm-type-wrap");
  const typeInp = document.getElementById("confirm-type-input");
  typeInp.value = "";
  typeWrap.classList.toggle("hidden", !requireText);

  const modal = document.getElementById("confirm-modal");
  modal.classList.remove("hidden");
  modal.classList.add("flex");
}

function closeConfirmModal() {
  confirmCtx = null;
  const modal = document.getElementById("confirm-modal");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

function executeConfirmModal() {
  if (!confirmCtx) return;
  if (confirmCtx.requireText) {
    const typed = document.getElementById("confirm-type-input").value.trim();
    if (typed !== confirmCtx.requireText) {
      showToast("Typed workspace name does not match");
      return;
    }
  }
  const fn = confirmCtx.onConfirm;
  closeConfirmModal();
  fn();
}

function askDeleteTenant(id) {
  const t = TENANTS.find((x) => x.id === id);
  if (!t) return;
  openConfirmModal({
    title: "Delete Workspace Permanently",
    desc: `This will permanently delete <strong>${esc(t.name)}</strong> (<code class="font-mono text-xs">${esc(t.slug)}</code>) and all associated customer records.`,
    requireText: t.name,
    btnLabel: "Delete Permanently",
    onConfirm: () => {
      const idx = TENANTS.findIndex((x) => x.id === id);
      if (idx > -1) TENANTS.splice(idx, 1);
      showToast(`Workspace "${t.name}" deleted`);
      go("tenants");
    }
  });
}

function askRevokeApiKey(id) {
  const k = APIKEYS.find((x) => x.id === id);
  if (!k) return;
  openConfirmModal({
    title: "Revoke Tenant API Key",
    desc: `Revoke <strong>${esc(k.name)}</strong> (<code class="font-mono text-xs">${esc(k.prefix)}…</code>) for ${esc(k.tenant)}? Requests using this token will immediately fail with 401 Unauthorized.`,
    btnLabel: "Revoke Token",
    onConfirm: () => {
      k.revoked = true;
      k.lastUsed = "22 Nov 2026";
      showToast(`API Key ${k.prefix} revoked`);
      render();
    }
  });
}

function askVoidInvoice(id) {
  const inv = INVOICES.find((x) => x.id === id);
  if (!inv) return;
  openConfirmModal({
    title: "Void Invoice",
    desc: `Mark invoice <strong>${esc(inv.number)}</strong> (${idr(inv.amount)}) for ${esc(inv.tenant)} as Void?`,
    btnLabel: "Void Invoice",
    onConfirm: () => {
      inv.status = "VOID";
      showToast(`Invoice ${inv.number} voided`);
      render();
    }
  });
}

function askRemoveAdmin(id) {
  const adm = ADMINS.find((x) => x.id === id);
  if (!adm) return;
  openConfirmModal({
    title: "Remove Platform Operator",
    desc: `Revoke Control Plane access for <strong>${esc(adm.name)}</strong> (<code class="font-mono text-xs">${esc(adm.email)}</code>)?`,
    btnLabel: "Remove Operator",
    onConfirm: () => {
      const idx = ADMINS.findIndex((x) => x.id === id);
      if (idx > -1) ADMINS.splice(idx, 1);
      showToast(`Operator ${adm.name} removed`);
      render();
    }
  });
}
