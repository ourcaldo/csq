services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: umkm_dev
      POSTGRES_USER: umkm
      POSTGRES_PASSWORD: umkm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umkm -d umkm_dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  pgdata:
