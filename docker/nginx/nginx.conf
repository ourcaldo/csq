# Nginx reverse proxy for CSQ.
# Terminates TLS (Certbot/Let's Encrypt), proxies to the Next.js app,
# passes WebSocket/SSE upgrade headers (the inbox SSE stream), and rate-limits
# the WhatsApp webhook. Cert paths are filled in by docker/certbot/init-certbot.sh.

# ── HTTP: ACME challenge + redirect to HTTPS ──
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: reverse proxy to the app ──
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/${CERT_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${CERT_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 10m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # WhatsApp webhook — rate-limited (Meta retries on non-2xx).
    location /api/webhooks/whatsapp {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else → app (SSE/upgrade supported for the inbox stream).
    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;        # important for SSE
        proxy_read_timeout 300s;
    }
}

# Rate-limit zone for the webhook.
limit_req_zone $binary_remote_addr zone=webhook:10m rate=10r/s;
