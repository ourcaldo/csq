# Production stack for CSQ on the HackFest VPS
# (4 vCPU / 4GB RAM / 20GB SSD Ubuntu). Run from the docker/ directory:
#   docker compose --env-file ../.env.production up -d --build
#
# Per-tenant OpenClaw cells (PRD §5/§26): there is NO single shared openclaw
# service here. CSQ provisions one isolated OpenClaw container per store via
# `openclaw fleet create <slug>` (OPENCLAW_PROVISIONING=fleet). To do that,
# the app container talks to the host Docker daemon through the mounted
# /var/run/docker.sock and has the `openclaw` + `docker` CLIs baked in (see
# Dockerfile). Cell containers run as siblings on the host, not in this compose.
# TLS is terminated by Nginx; Certbot renews certificates.

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v25.0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # OpenClaw per-tenant cell provisioning (production = fleet).
      OPENCLAW_PROVISIONING: fleet
      OPENCLAW_AGENT_MODEL: ${OPENCLAW_AGENT_MODEL:-fireworks/accounts/fireworks/models/qwen3p7-plus}
      # Dev-only fallback (unused in fleet mode, but required by the code path).
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://127.0.0.1:18789}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-}
    volumes:
      # Required for `openclaw fleet create` + `docker exec <cell>` to manage
      # per-tenant cell containers on the host daemon. Keep this; without it,
      # provisioning and agent creation cannot work in fleet mode.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist Baileys auth state (bring-your-own-number WhatsApp sessions)
      # across app restarts so owners don't re-scan the QR.
      - baileys-auth:/app/.baileys-auth
      # Persist OpenClaw Fleet cell metadata across app restarts.
      - openclaw-fleet:/data/.openclaw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # node is guaranteed present in the slim image; wget/curl are not.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umkm_prod}
      POSTGRES_USER: ${POSTGRES_USER:-umkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umkm} -d ${POSTGRES_DB:-umkm_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  nginx:
    build: ./nginx
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the nginx image's envsubst of nginx.conf.template so the
      # ${CERT_DOMAIN} TLS cert paths resolve at runtime.
      CERT_DOMAIN: ${CERT_DOMAIN}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "certbot renew --webroot -w /var/www/certbot --quiet &&
      sleep 12h && exit 0"
    restart: unless-stopped

volumes:
  pgdata:
  baileys-auth:
  openclaw-fleet:
