# Production stack for CSQ on the VPS (4 vCPU / 4GB RAM / 20GB SSD Ubuntu).
# Run from the docker/ directory:
#   docker compose --env-file ../.env.production up -d
#
# Do NOT run `up -d --build` on the 4GB VPS - the Next.js build will OOM.
# Prebuild the images elsewhere/CI, push to a registry, set CSQ_APP_IMAGE,
# CSQ_API_IMAGE, CSQ_WORKER_IMAGE and CSQ_NGINX_IMAGE in .env.production,
# then `docker compose pull && docker compose up -d`.
#
# Topology (PRD 23C): dashboard (UI + BFF), api (token realm, Tool Gateway,
# Meta webhook, media), worker (the only socket owner: Baileys, all ticks,
# outbox, commands), nginx, postgres, certbot.
#
# Resource budget: app 1280m + api 384m + worker 512m + postgres 1024m +
# nginx 64m + certbot 64m = ~3.3 GB, leaving ~700 MB for the OS. Adjust only
# if you understand the headroom trade-off.

services:
  app:
    image: ${CSQ_APP_IMAGE:-csq/app:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dashboard
    mem_limit: 1280m
    cpus: 2.0
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      # The dashboard BFF calls the product API over the public origin; nginx
      # routes /api/v1, /api/media and the Meta webhook to the api service.
      API_URL: ${API_URL}
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # node is guaranteed present in the slim image; wget/curl are not.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  api:
    image: ${CSQ_API_IMAGE:-csq/api:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: api
    mem_limit: 384m
    cpus: 0.75
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_URL: ${API_URL}
      API_SERVICE_TOKENS: ${API_SERVICE_TOKEN}
      API_JWT_SECRET: ${API_JWT_SECRET}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      WHATSAPP_APPROVAL_TEMPLATE: ${WHATSAPP_APPROVAL_TEMPLATE:-}
      WHATSAPP_AGENT_FALLBACK_TEMPLATE: ${WHATSAPP_AGENT_FALLBACK_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-id}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
      SCENARIO_SCHEDULE_TZ: ${SCENARIO_SCHEDULE_TZ:-Asia/Jakarta}
      KNOWLEDGE_SIMILARITY_THRESHOLD: ${KNOWLEDGE_SIMILARITY_THRESHOLD:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    image: ${CSQ_WORKER_IMAGE:-csq/worker:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: worker
    mem_limit: 512m
    cpus: 1.0
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_URL: ${API_URL}
      PORT: "10000"
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1024}
      WHATSAPP_APPROVAL_TEMPLATE: ${WHATSAPP_APPROVAL_TEMPLATE:-}
      WHATSAPP_AGENT_FALLBACK_TEMPLATE: ${WHATSAPP_AGENT_FALLBACK_TEMPLATE:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-id}
      SCENARIO_SCHEDULE_TZ: ${SCENARIO_SCHEDULE_TZ:-Asia/Jakarta}
      KNOWLEDGE_SIMILARITY_THRESHOLD: ${KNOWLEDGE_SIMILARITY_THRESHOLD:-0.5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      # Host-only: the alert cron probes this listener; nginx never proxies it.
      - "127.0.0.1:10000:10000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:10000',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Mode A database (self-hosted). Unused when DATABASE_URL points at a
  # managed Postgres such as Neon (Mode B) - in that mode remove this service
  # and keep app + api + worker + nginx + certbot. Do NOT point this local
  # service at the same database as DATABASE_URL; they are alternative modes.
  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 1024m
    cpus: 1.5
    shm_size: 256mb
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "effective_cache_size=768MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umkm_prod}
      POSTGRES_USER: ${POSTGRES_USER:-umkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umkm} -d ${POSTGRES_DB:-umkm_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  nginx:
    image: ${CSQ_NGINX_IMAGE:-csq/nginx:latest}
    build: ./nginx
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      app:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERT_DOMAIN: ${CERT_DOMAIN}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "certbot renew --webroot -w /var/www/certbot --quiet &&
      sleep 12h && exit 0"
    restart: unless-stopped

volumes:
  pgdata:
