# Production stack for CSQ on the HackFest VPS
# (4 vCPU / 4GB RAM / 20GB SSD Ubuntu). Run from the docker/ directory:
#   docker compose --env-file ../.env.production up -d
#
# ⚠️  Do NOT run `up -d --build` on the 4GB VPS — the Next.js build will OOM.
# Prebuild the image elsewhere/CI, push to a registry, set CSQ_APP_IMAGE +
# CSQ_NGINX_IMAGE in .env.production, then `docker compose pull && docker
# compose up -d`. (docker/setup-vps.sh does this for you.)
#
# Per-tenant OpenClaw cells (PRD §5/§26): there is NO single shared openclaw
# service here. CSQ provisions one isolated OpenClaw container per store via
# `openclaw fleet create <slug>` (OPENCLAW_PROVISIONING=fleet). To do that,
# the app container talks to the host Docker daemon through the mounted
# /var/run/docker.sock and has the `openclaw` + `docker` CLIs baked in (see
# Dockerfile). Cell containers run as siblings on the host, not in this compose.
# TLS is terminated by Nginx; Certbot renews certificates.
#
# Resource limits (H7): total container budget ~2.4 GB to leave headroom for
# the OS (~400 MB) and per-tenant OpenClaw cell containers spawned at runtime
# on the 4 GB host. Adjust only if you understand the headroom trade-off.

services:
  app:
    image: ${CSQ_APP_IMAGE:-csq/app:latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    mem_limit: 1280m
    cpus: 2.0
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # OpenClaw per-tenant cell provisioning (production = fleet).
      OPENCLAW_PROVISIONING: fleet
      OPENCLAW_AGENT_MODEL: ${OPENCLAW_AGENT_MODEL:-fireworks/accounts/fireworks/models/qwen3p7-plus}
      # Dev-only fallback (unused in fleet mode, but required by the code path).
      OPENCLAW_BASE_URL: ${OPENCLAW_BASE_URL:-http://127.0.0.1:18789}
      OPENCLAW_API_KEY: ${OPENCLAW_API_KEY:-}
    volumes:
      # ⚠️  SECURITY — CONTAINER ESCAPE RISK: mounting the host Docker socket
      # gives the app container full root-equivalent control over the host
      # Docker daemon. Any code running in the app container can create/kill
      # containers, mount arbitrary host paths, and effectively escape to the
      # host. This mount is required for `openclaw fleet create <slug>` to
      # provision per-tenant cell containers as siblings on the host (PRD
      # §5/§26). Mitigation path: replace this direct mount with a Docker
      # socket proxy (e.g. tecnativa/docker-socket-proxy) that exposes only
      # the minimal API surface needed (container create/inspect/exec) and
      # blocks the rest. Do NOT remove this mount without an equivalent
      # provisioning path.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist Baileys auth state (bring-your-own-number WhatsApp sessions)
      # across app restarts so owners don't re-scan the QR.
      - baileys-auth:/app/.baileys-auth
      # Persist OpenClaw Fleet cell metadata across app restarts.
      - openclaw-fleet:/data/.openclaw
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # node is guaranteed present in the slim image; wget/curl are not.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    mem_limit: 1024m
    cpus: 1.5
    shm_size: 256mb
    # Tuned for a 1 GB memory limit on a 4 GB host (H7). shared_buffers is
    # ~25% of the container limit; work_mem is conservative for concurrent
    # connections; effective_cache_size hints the planner about available
    # OS cache outside the container's own memory.
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "work_mem=4MB", "-c", "effective_cache_size=768MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-umkm_prod}
      POSTGRES_USER: ${POSTGRES_USER:-umkm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-umkm} -d ${POSTGRES_DB:-umkm_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"

  nginx:
    image: ${CSQ_NGINX_IMAGE:-csq/nginx:latest}
    build: ./nginx
    mem_limit: 64m
    cpus: 0.25
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the nginx image's envsubst of nginx.conf.template so the
      # ${CERT_DOMAIN} TLS cert paths resolve at runtime.
      CERT_DOMAIN: ${CERT_DOMAIN}
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: >
      /bin/sh -c "certbot renew --webroot -w /var/www/certbot --quiet &&
      sleep 12h && exit 0"
    restart: unless-stopped

volumes:
  pgdata:
  baileys-auth:
  openclaw-fleet:
